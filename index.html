<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CAMERA MASTER</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:inherit}
body{margin:0;font-family:Outfit,system-ui,sans-serif;color:#e8eeff;background:radial-gradient(at 15% 0,#2b1a6b 0,transparent 45%),radial-gradient(at 90% 10%,#0a4a7a 0,transparent 40%),#070b1f;min-height:100vh}
#hd{display:flex;gap:8px;align-items:center;padding:8px 14px;position:sticky;top:0;z-index:5;border-radius:0}
.sp{flex:1}.g{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:16px;padding:14px}
main{max-width:1050px;margin:auto;padding:14px}h1,h2,h3{margin:.3em 0}
.b,.sm{border:0;border-radius:12px;color:#fff;font:600 15px Outfit;padding:11px 20px;cursor:pointer;background:linear-gradient(90deg,#2f6bff,#a855f7);box-shadow:0 0 18px #2f6bff88;transition:.2s;margin:4px}.b:hover{transform:translateY(-2px);box-shadow:0 0 28px #00e5ff}
.sm{padding:6px 11px;font-size:13px;background:#ffffff1f;box-shadow:none}.o{background:linear-gradient(90deg,#ff8a1f,#ffd23f);color:#222;box-shadow:0 0 18px #ff8a1f88}
.big{font-size:44px;font-weight:800;background:linear-gradient(90deg,#00e5ff,#a855f7,#ff8a1f);-webkit-background-clip:text;color:transparent;text-align:center;line-height:1.1}
.c{text-align:center}.gr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.bar{height:12px;background:#ffffff22;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00e5ff,#ffd23f);transition:.5s}
.it{display:inline-block;margin:4px;padding:10px 12px;border-radius:12px;background:#ffffff18;border:1px solid #ffffff33;cursor:grab;user-select:none}.it.on{background:#00e5ff33;border-color:#00e5ff}
.dz{min-height:110px;border:2px dashed #00e5ff88;border-radius:14px;padding:8px}
.vw{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;border:2px solid #333;background:#000}
.mv,.st{position:absolute;inset:0}.bk{position:absolute;border-radius:50%;background:#ffffff55}
.sj{position:absolute;top:0;height:100%;transform:translateX(-50%)}.sj svg{height:100%;aspect-ratio:1/2;transform-origin:50% 14%}
.ov{position:absolute;inset:0;pointer-events:none}.gd{background:linear-gradient(#fff6,#fff6) 33.3% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 66.6% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 0 33.3%/100% 1px no-repeat,linear-gradient(#fff6,#fff6) 0 66.6%/100% 1px no-repeat}
.rec{position:absolute;top:8px;left:10px;color:#f33;font-weight:800;display:none}.recon .rec{display:block;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.pan{animation:pn 2s linear infinite alternate}@keyframes pn{to{transform:translateX(-9%) scale(1.12)}}
.tilt{animation:tl 2s linear infinite alternate}@keyframes tl{to{transform:translateY(9%) scale(1.12)}}
.zoom,.dolly{animation:zm 2s linear infinite alternate}@keyframes zm{to{transform:scale(1.35)}}
.track{animation:tr 2s linear infinite alternate}@keyframes tr{from{transform:translateX(-6%) scale(1.1)}to{transform:translateX(6%) scale(1.1)}}
.crane{animation:cr 2s linear infinite alternate}@keyframes cr{from{transform:translateY(8%) scale(1.1)}to{transform:translateY(-8%) scale(1.1)}}
.hand{animation:hd .25s linear infinite}@keyframes hd{25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
.ctl{display:grid;grid-template-columns:90px 1fr 70px;gap:6px;align-items:center;font-size:14px}input[type=range]{width:100%}
select,input[type=text]{background:#12183a;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:6px;font:inherit}
.ch{display:inline-block;margin:3px;padding:6px 10px;border-radius:20px;background:#ffffff1c;cursor:pointer;font-size:13px;border:1px solid #ffffff33}.ch.on{background:#a855f7;box-shadow:0 0 10px #a855f7}
.mo{position:fixed;inset:0;background:#000b;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px}.mc{max-width:640px;max-height:88vh;overflow:auto;background:#0e1535}
.tl{display:flex;gap:6px;min-height:100px;overflow-x:auto}.cl{flex:none;width:130px;border-radius:10px;padding:6px;font-size:12px;background:#ffffff18;border:1px solid #fff4;cursor:grab}.th{height:56px;border-radius:6px;margin-bottom:4px}
.ok{color:#5dffa0}.no{color:#ff7a7a}.cert{background:#fff;color:#223;text-align:center;border:8px double #c9a227;padding:30px;border-radius:6px}.cert *{color:#223}
.it{width:112px;text-align:center;font-size:12px;vertical-align:top}.t3{width:64px;height:64px;margin:8px auto 4px;position:relative;transform-style:preserve-3d;animation:sp3 5s ease-in-out infinite;pointer-events:none}.t3 i{position:absolute;inset:0}@keyframes sp3{0%,100%{transform:perspective(300px) rotateY(-38deg) rotateX(10deg)}50%{transform:perspective(300px) rotateY(38deg) rotateX(-6deg) translateY(-4px)}}
@media(max-width:640px){.big{font-size:30px}.ctl{grid-template-columns:70px 1fr 56px}}@media print{body>*:not(#m){display:none}.mo{position:static;background:none}.mc button{display:none}}
</style></head><body>
<header class="g" id="hd"><b onclick="menu()" style="cursor:pointer">🎬 CAMERA MASTER</b><span id="pl" style="font-size:13px"></span><span class="sp"></span><button class="sm" onclick="pause()">⏸ Pause</button><button class="sm" onclick="cur()">🔄 Restart</button><button id="mus" class="sm" onclick="music()">🎵 OFF</button></header>
<main id="app"></main><div id="m"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),LG=Math.log2;
let S={name:'',xp:0,sc:{},l2:[],badges:[]},cur=()=>menu(),ac,mus=0,mt;
try{Object.assign(S,JSON.parse(localStorage.getItem('cm1')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('cm1',JSON.stringify(S))}catch(e){}};
const beep=(f=660,d=.15,t='sine')=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const win=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*120));
function music(){mus=!mus;$('#mus').textContent=mus?'🎵 ON':'🎵 OFF';clearInterval(mt);if(mus){let i=0;const n=[262,330,392,330,294,349,440,349];mt=setInterval(()=>beep(n[i++%8],.3,'triangle'),400)}}
function modal(h){$('#m').innerHTML=`<div class="mo"><div class="g mc">${h}<div class="c"><button class="b" onclick="cl()">Tutup</button></div></div></div>`}
const cl=()=>$('#m').innerHTML='';
const pause=()=>modal('<h2>⏸ Game dijeda</h2><p>Tekan Tutup untuk melanjutkan.</p>');
const stars=p=>p>=90?3:p>=75?2:p>=60?1:0,st=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
const done=l=>Object.keys(S.sc).filter(k=>S.sc[k]>=60).length;
function head(){$('#pl').textContent=S.name?`👤 ${S.name}${S.kelas?' ('+S.kelas+')':''} · ${S.xp} XP`:''}
const M={1:[['Peralatan Kamera','DSLR, Mirrorless, Camcorder, dan Cinema Camera punya fungsi berbeda. Mirrorless ringan dan praktis; Cinema Camera untuk film. Contoh: video profil sekolah cukup memakai Mirrorless 4K. Tips: selalu bawa baterai dan memory card cadangan.'],['Bagian Kamera','Sensor menangkap cahaya, viewfinder/LCD untuk melihat gambar, focus ring mengatur ketajaman, hot shoe untuk menempel mic/lampu, input audio untuk mikrofon. Tips: hafalkan letak tombol sebelum syuting.'],['Jenis Lensa','Wide angle untuk ruangan sempit dan lokasi luas, standard mirip mata manusia, telephoto untuk objek jauh. Prime punya bukaan besar, zoom fleksibel. Tips: lensa zoom 24-70mm cocok untuk liputan.'],['Perencanaan Shot','Baca naskah dan storyboard, tentukan jenis shot, angle, gerakan, lensa, lalu lakukan camera checklist. Contoh: wawancara = MS/MCU, tripod, eye level.']],2:[['Segitiga Exposure','ISO (kepekaan), Aperture (bukaan lensa) dan Shutter Speed (waktu buka) menentukan terang gambar. ISO tinggi = noise. Aperture besar (angka f kecil) = background blur. Tips: shutter speed ideal = 2x frame rate (25 fps = 1/50).'],['Ukuran Shot','ELS-LS menunjukkan lokasi, MS-MCU untuk dialog/wawancara, CU-ECU untuk emosi dan detail. Tips: variasikan ukuran shot agar editing mudah.'],['Camera Angle','Eye level netral, high angle membuat objek kecil, low angle membuat objek berwibawa, bird eye menunjukkan lokasi dari atas, dutch angle memberi kesan tegang.'],['Gerakan Kamera','Pan/tilt memutar kamera, tracking/dolly memindahkan kamera, crane naik-turun, handheld terasa dokumenter. Tips: gerakan harus punya alasan.'],['Komposisi','Rule of thirds menaruh subjek di garis sepertiga. Beri looking room/lead room pada arah pandang, jaga headroom. Tips: aktifkan grid.'],['White Balance','Lampu studio sekitar 3200K, siang hari 5600K. WB salah membuat gambar kebiruan atau jingga.']],3:[['Review Footage','Periksa semua rekaman: buang yang gelap, blur, goyang. Pilih take terbaik.'],['Urutan & Continuity','Susun establishing, medium, lalu detail agar cerita jelas dan kesinambungan terjaga. Cut to cut berpindah langsung; cutaway/insert menyisipkan gambar pendukung.'],['Rough Cut ke Final Cut','Rough cut = susunan kasar, final cut = versi akhir yang rapi, lalu export (misal MP4 H.264).']]};
function materi(l){modal(`<h2>📚 Materi ${l?'Level '+l:''}</h2><div class="c"><button class="b o" onclick="sa()">📐 Materi Lengkap Shot dan Angle</button></div>`+(l?[l]:[1,2,3]).map(k=>M[k].map(x=>`<div class="g" style="margin:8px 0"><b>📘 ${x[0]}</b><br>${x[1]}</div>`).join('')).join(''))}
const guide=()=>modal('<h2>🎮 Panduan Bermain</h2><p>1. Isi nama pemain.<br>2. Level 1: seret (atau klik) peralatan ke tas, pilih shot sesuai storyboard.<br>3. Level 2: atur kamera sampai meter exposure di tengah, fokus tajam, WB sesuai, pilih shot, angle, gerakan, lalu tekan RECORD dan STOP.<br>4. Level 3: pilih footage bagus, susun di timeline, lalu Export.<br>Nilai 60 ke atas lolos. Progress tersimpan otomatis.</p>');
function ach(){const B={'Camera Explorer':'Selesaikan Level 1','Exposure Expert':'Exposure rata-rata baik','Focus Master':'Fokus rata-rata baik','Composition Artist':'Komposisi rata-rata baik','Professional Cameraman':'Level 2 nilai 75+','Cinematographer Champion':'Semua level, rata-rata 80+'};modal('<h2>🏆 Pencapaian</h2>'+Object.keys(B).map(b=>`<div class="g" style="margin:6px 0">${S.badges.includes(b)?'🏅':'🔒'} <b>${b}</b> <small>${B[b]}</small></div>`).join(''))}
function bd(){const a=k=>S.l2.length?S.l2.reduce((s,r)=>s+r[k],0)/S.l2.length:0,b=[],c=S.sc;if(c[1]>=60)b.push('Camera Explorer');if(a('exp')>=.8)b.push('Exposure Expert');if(a('foc')>=.8)b.push('Focus Master');if(a('comp')>=.8)b.push('Composition Artist');if(c[2]>=75)b.push('Professional Cameraman');if(c[1]>=60&&c[2]>=60&&c[3]>=60&&(c[1]+c[2]+c[3])/3>=80)b.push('Cinematographer Champion');S.badges=b}
function menu(){cur=menu;head();const p=Math.round(done()/3*100);A.innerHTML=`<div class="c"><svg width="190" height="130" viewBox="0 0 190 130"><rect x="25" y="30" width="110" height="70" rx="12" fill="#1b2350" stroke="#00e5ff" stroke-width="3"/><rect x="135" y="45" width="35" height="40" rx="8" fill="#a855f7"/><circle cx="80" cy="65" r="26" fill="#0a1030" stroke="#ff8a1f" stroke-width="5"/><circle cx="80" cy="65" r="12" fill="#2f6bff"><animate attributeName="r" values="12;8;12" dur="2s" repeatCount="indefinite"/></circle><circle cx="120" cy="42" r="5" fill="#f33"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle><path d="M60 100 L45 125M100 100 L115 125M80 100V125" stroke="#ffd23f" stroke-width="4"/></svg><div class="big">CAMERA MASTER</div><h3>THE CINEMATOGRAPHER SIMULATOR</h3><p>Jadilah kamerawan profesional: dari perencanaan sampai editing!</p>
<button class="b" onclick="start()">▶ MULAI SIMULASI</button><button class="b" onclick="guide()">📖 PANDUAN BERMAIN</button><button class="b" onclick="materi(0)">📚 MATERI PEMBELAJARAN</button><button class="b o" onclick="ach()">🏆 PENCAPAIAN</button><button class="sm" onclick="out()">🚪 Ganti Pemain</button></div>
<div class="g" style="max-width:500px;margin:12px auto"><b>Progress: ${p}% · ${S.xp} XP</b><div class="bar"><i style="width:${p}%"></i></div></div><p class="c" style="opacity:.7">SMKN 1 DOMPU – BROADCASTING DAN PERFILMAN<br>🎮 Simulator by <b>Andi Ferry Rahman</b></p>`}
function start(){if(S.name)return lv();login()}
function login(){cur=login;head();A.innerHTML=`<div class="g c" style="max-width:420px;margin:30px auto"><div class="big" style="font-size:30px">CAMERA MASTER</div><h2>🔐 Login Pemain</h2><p>Isi data berikut untuk memulai simulasi.</p><input type="text" id="nm" placeholder="Nama lengkap" maxlength="30"><br><br><input type="text" id="kl" placeholder="Kelas (contoh: XI BC 1)" maxlength="20"><br><button class="b" onclick="nm()">Masuk ➜</button><br><small style="opacity:.7">SMKN 1 DOMPU – BROADCASTING DAN PERFILMAN</small></div>`}
function nm(){const v=$('#nm').value.trim(),k=$('#kl').value.trim();if(!v)return $('#nm').focus();if(!k)return $('#kl').focus();S.name=v;S.kelas=k;sv();guide();lv()}
function lv(){cur=lv;head();const N=[['🎒','LEVEL 1','Pre-Production: The Camera Planner'],['🎥','LEVEL 2','Production: The Camera Operator'],['✂️','LEVEL 3','Post-Production: The Visual Editor']];A.innerHTML=`<h2 class="c">Pilih Level</h2><div class="gr">${N.map((n,i)=>{const l=i+1,lock=l>1&&!(S.sc[l-1]>=60);return`<div class="g c"><div style="font-size:50px">${n[0]}</div><h3>${n[1]}</h3><p>${n[2]}</p><p>${S.sc[l]!=null?st(stars(S.sc[l]))+' Skor '+S.sc[l]:lock?'🔒 Selesaikan level sebelumnya':'Belum dimainkan'}</p><button class="b" ${lock?'disabled style="opacity:.4"':''} onclick="L${l}()">Main</button><button class="b o" onclick="materi(${l})">MATERI</button></div>`}).join('')}</div><div class="c"><button class="b" onclick="evalS()">📊 Hasil Evaluasi</button></div>`}
function fin(l,p,fb,again){const s=stars(p),ok=p>=60;if(ok){win();const old=S.sc[l]==null?0:stars(S.sc[l]);S.xp+=Math.max(0,s-old)*50+(S.sc[l]==null?50:0)}else beep(150,.4,'sawtooth');S.sc[l]=Math.max(S.sc[l]||0,p);bd();sv();head();A.innerHTML=`<div class="g c"><h1>${ok?'🎉 Misi Selesai!':'😅 Belum Berhasil'}</h1><div style="font-size:40px">${st(s)}</div><h2>Nilai: ${p}/100</h2><div style="text-align:left">${fb}</div><button class="b" onclick="${again}()">🔁 Ulangi</button>${ok?`<button class="b o" onclick="${l<3?'lv()':'evalS()'}">Lanjut ➜</button>`:'<p>Pelajari penjelasan di atas dan coba lagi.</p>'}</div>`}
// LEVEL 1
const I=[['mir','📷','Kamera Mirrorless 4K',1,'Ringan dan 4K, cocok untuk video profil.'],['zoom','🔭','Lensa Zoom 24-70mm',1,'Fleksibel dari wide sampai medium.'],['card','💾','Memory Card 128GB V30',1,'Cepat dan muat untuk video 4K.'],['tri','🪜','Tripod fluid head',1,'Wawancara butuh gambar stabil.'],['bat','🔋','Baterai cadangan',1,'Syuting lama butuh baterai ekstra.'],['tele','🎯','Lensa Telephoto 600mm',0,'Terlalu sempit untuk ruang kelas dan gedung dekat.'],['c4','💽','Memory Card 4GB lama',0,'Kapasitas kecil dan lambat, tidak cukup untuk 4K.'],['mono','🦯','Monopod saja',0,'Kurang stabil untuk wawancara; tripod lebih tepat.']],
SH=[['ELS gedung sekolah (establishing)',1,'Establishing shot memperkenalkan lokasi.'],['MS wawancara kepala sekolah',1,'MS/MCU standar untuk wawancara.'],['MLS kegiatan siswa di kelas',1,'Menunjukkan aktivitas dan ruang.'],['CU detail tangan praktik',1,'Detail memperkuat cerita.'],['ECU bola mata siswa',0,'Tidak ada di storyboard dan tidak mendukung profil sekolah.'],['BCU lensa kamera',0,'Tidak relevan dengan isi video profil.']];
const IC={mir:'<rect x="6" y="20" width="48" height="28" rx="6" fill="#2b4fff"/><rect x="38" y="13" width="12" height="8" rx="2" fill="#a855f7"/><circle cx="28" cy="34" r="12" fill="#0a1030" stroke="#00e5ff" stroke-width="3"/><circle cx="28" cy="34" r="5" fill="#ffd23f"/><circle cx="48" cy="26" r="2" fill="#f33"/>',zoom:'<rect x="6" y="16" width="48" height="28" rx="5" fill="#222a55"/><rect x="14" y="14" width="6" height="32" fill="#00e5ff"/><rect x="26" y="14" width="10" height="32" fill="#444c7a"/><rect x="42" y="18" width="4" height="24" fill="#ff8a1f"/><circle cx="54" cy="30" r="3" fill="#2f6bff"/>',card:'<path d="M12 6h28l10 10v38H12z" fill="#a855f7"/><rect x="18" y="8" width="3" height="10" fill="#ffd23f"/><rect x="24" y="8" width="3" height="10" fill="#ffd23f"/><rect x="30" y="8" width="3" height="10" fill="#ffd23f"/><text x="18" y="42" font-size="11" fill="#fff" font-weight="bold">128GB</text>',tri:'<rect x="20" y="6" width="20" height="10" rx="3" fill="#2f6bff"/><path d="M30 16L12 56M30 16V56M30 16L48 56" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>',bat:'<rect x="8" y="18" width="40" height="26" rx="4" fill="#1b2350" stroke="#5dffa0" stroke-width="3"/><rect x="48" y="26" width="6" height="10" fill="#5dffa0"/><rect x="13" y="23" width="8" height="16" fill="#5dffa0"/><rect x="24" y="23" width="8" height="16" fill="#5dffa0"/><rect x="35" y="23" width="8" height="16" fill="#5dffa0"/>',tele:'<rect x="2" y="22" width="20" height="18" rx="3" fill="#222a55"/><rect x="22" y="18" width="32" height="26" rx="4" fill="#e8eeff"/><rect x="50" y="16" width="6" height="30" rx="2" fill="#f33"/><rect x="30" y="18" width="4" height="26" fill="#aab"/>',c4:'<path d="M16 12h22l8 8v30H16z" fill="#778"/><rect x="21" y="14" width="3" height="8" fill="#ccc"/><rect x="27" y="14" width="3" height="8" fill="#ccc"/><text x="21" y="40" font-size="10" fill="#fff">4GB</text>',mono:'<rect x="24" y="4" width="12" height="8" rx="2" fill="#ff8a1f"/><rect x="28" y="12" width="4" height="34" fill="#ffd23f"/><rect x="29" y="46" width="2" height="10" fill="#aab"/>'};
const t3=k=>{let h='';for(let z=-8;z<=8;z+=4)h+=`<i style="transform:translateZ(${z}px);filter:brightness(${.55+(z+8)/16*.45})"><svg viewBox="0 0 60 60" width="64" height="64">${IC[k]}</svg></i>`;return`<div class="t3">${h}</div>`};
function L1(){cur=L1;A.innerHTML=`<div class="g"><h2>🎒 Level 1 – Camera Planner</h2><p><b>Skenario:</b> Produksi video profil SMKN 1 Dompu. Storyboard: 1) gedung sekolah, 2) wawancara kepala sekolah di ruang kelas, 3) siswa praktik, 4) detail alat praktik. Pilih peralatan terbaik dan seret ke tas, lalu pilih shot yang dibutuhkan.</p><button class="sm" onclick="materi(1)">📚 MATERI</button></div>
<div class="g"><b>Peralatan (seret ke tas atau klik)</b><div id="tray" ondragover="event.preventDefault()" ondrop="dr(event,'tray')">${I.map(i=>`<span class="it" draggable="true" data-id="${i[0]}" ondragstart="event.dataTransfer.setData('t','${i[0]}')" onclick="mv1(this)">${t3(i[0])}${i[2]}</span>`).join('')}</div></div>
<div class="g"><b>🎒 Camera Equipment Bag</b><div id="bag" class="dz" ondragover="event.preventDefault()" ondrop="dr(event,'bag')"></div></div>
<div class="g"><b>Shot yang dibutuhkan (klik untuk memilih)</b><br>${SH.map((s,i)=>`<span class="ch" data-i="${i}" onclick="this.classList.toggle('on')">${s[0]}</span>`).join('')}<div class="c"><button class="b" onclick="chk1()">✅ Camera Checklist & Selesai</button></div></div>`}
function dr(e,t){e.preventDefault();const el=document.querySelector(`[data-id=${e.dataTransfer.getData('t')}]`);if(el)$('#'+t).appendChild(el)}
function mv1(el){$('#'+(el.parentNode.id=='bag'?'tray':'bag')).appendChild(el)}
